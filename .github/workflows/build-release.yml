name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/wechat-native-ai.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-native-ai-apk
          path: release/wechat-native-ai.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK Build ${{ github.run_number }}
          body: |
            自动构建的微聊 APK。
            v4.6 做了一轮卡顿源头治理和主动消息架构优化。
            AI 流式 delta 不再进入 UI 主线程，完整生成后第一条气泡快速出现，后续气泡逐条轻量追加，不再整屏重绘。
            聊天列表只渲染最近消息窗口，历史消息折叠，避免消息多后黑屏、卡死或长时间布局。
            主动消息后台心跳自动以 1-3 分钟轻量检查当前人设，用户短时间没回也会让人设按语境判断是否补一句或跳过。
            记忆整理改用独立网络客户端，避免和聊天生成互相抢连接；图片 URI 加安全加载，降低背景/头像失效导致的卡退。
          files: release/wechat-native-ai.apk
