name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/wechat-native-ai.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-native-ai-apk
          path: release/wechat-native-ai.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK Build ${{ github.run_number }}
          body: |
            自动构建的微聊 APK。
            v4.7 继续做源头级卡顿治理和主动消息修正。
            AI 生成时第一条气泡现在会按流式内容快速预览，不再等整段生成结束才显示正文；最终仍会清洗分隔符和广告文本。
            聊天区整屏刷新改为分帧分批渲染，发送、总结、切换和多气泡追加都尽量避免一次性创建大量 View。
            多条 AI 气泡改为按累计延迟逐条弹出，避免多个气泡同一帧一起冒出来。
            图片背景和头像改为后台降采样解码并缓存，减少大图 URI 导致的黑屏、卡退和主线程卡顿。
            主动消息后台心跳改为 1 分钟轻量检查；当前聊天对象短时间未回复也会进入语境判断，适合时主动补一句，不适合则跳过。
            通知发送前增加 Android 13+ 通知权限兜底，避免无权限时崩溃；设置页仍保留通知测试和后台保活入口。
          files: release/wechat-native-ai.apk
