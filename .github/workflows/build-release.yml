name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/wechat-native-ai.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-native-ai-apk
          path: release/wechat-native-ai.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK Build ${{ github.run_number }}
          body: |
            自动构建的微聊 APK。
            v4.5 修复 AI 原始分隔文本短暂暴露的问题，并重做消息出现节奏。
            生成期间只显示“对方正在输入…”，不再显示带 / 或 \ 的原始流式文本；完整生成后再解析并按气泡逐条弹出。
            主动消息心跳改为后台检查语义：到间隔只触发判断，不等于必须发送，人设会结合当前时间、上下文和聊天氛围自主决定是否跳过。
            手动主动消息、普通回复和通知预览统一走解析后的第一条气泡，避免通知或界面暴露未拆分原文。
          files: release/wechat-native-ai.apk
