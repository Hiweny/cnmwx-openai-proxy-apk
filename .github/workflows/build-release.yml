name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/wechat-native-ai.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-native-ai-apk
          path: release/wechat-native-ai.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK Build ${{ github.run_number }}
          body: |
            自动构建的微聊 APK。
            v4.3 修复生成消息卡顿、设置面板不可滑动，并重构侧边栏。
            流式生成改为只更新当前 AI 气泡，避免整屏重建；顶部栏压缩，消息/记忆计数移入侧栏。
            新增左侧可滚动侧边栏，集中管理聊天对象、人设编辑、AI 头像、记忆、主题、主动消息和全局设置。
            主动消息新增开机/应用更新后自动恢复心跳，注册前取消旧心跳，并增强通知权限异常保护。
          files: release/wechat-native-ai.apk
