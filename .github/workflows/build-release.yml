name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/wechat-native-ai.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-native-ai-apk
          path: release/wechat-native-ai.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK Build ${{ github.run_number }}
          body: |
            自动构建的微聊 APK。
            v4.2 继续打磨聊天体验、主动消息和界面细节。
            新增聊天资料入口、AI 头像快捷设置、手动主动发消息、主动消息心跳、通知通道和后台保活申请入口。
            优化生成中渲染节流、智能滚动、键盘发送按钮、圆润顶栏和圆润输入栏。
          files: release/wechat-native-ai.apk
