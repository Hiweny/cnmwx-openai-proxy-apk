name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/wechat-native-ai.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-native-ai-apk
          path: release/wechat-native-ai.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK Build ${{ github.run_number }}
          body: |
            自动构建的微聊 APK。
            v4.1 继续按 WeChatBot_Web 体验打磨原生 Android 聊天模拟器。
            新增微信、QQ、iOS、Telegram、Discord 多主题与深色变体，优化头像、头栏、输入栏、气泡宽度、圆角和键盘顶起体验。
            补齐顶部人设编辑入口、AI 头像设置、默认气泡分割提示词和长回复兜底拆分。
          files: release/wechat-native-ai.apk
