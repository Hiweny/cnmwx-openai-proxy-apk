name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/wechat-native-ai.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-native-ai-apk
          path: release/wechat-native-ai.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK Build ${{ github.run_number }}
          body: |
            自动构建的微聊 APK。
            v4.8 修复 AI 回复时页面闪烁和输入框失焦，并做全面审查改进。
            滚动到底部改用 scrollTo 替代 fullScroll，不再从输入框抢走焦点。
            聊天区渲染改用 suppressLayout 单次布局，移除分帧批量渲染，消除多帧布局变化导致的闪烁。
            AI 回复流程中所有错误/停止/空回复路径改为就地更新气泡文本，不再触发全量 renderAll。
            流式预览回调移除 renderAll 回退，避免流式过程中不必要的整屏重建。
            revealAssistantParts 延迟回调增加 isFinishing/isDestroyed 安全检查，防止 Activity 销毁后崩溃。
            图片缓存改为 LRU LinkedHashMap，限制 12 张，防止内存无限增长；onDestroy 时回收 Bitmap。
            OkHttpClient 改为静态共享实例，避免每次创建新连接池和线程池。
          files: release/wechat-native-ai.apk
