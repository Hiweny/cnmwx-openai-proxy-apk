name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/cnmwx-native-chat.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cnmwx-native-chat-apk
          path: release/cnmwx-native-chat.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK Build ${{ github.run_number }}
          body: |
            自动构建的公益聊天 APK。
            v3.0 已改为直接调用公益接口的前端聊天应用，不再运行本地 OpenAI 代理或后台服务。
            支持流式聊天、停止生成、自定义人格、时间注入、壁纸设置和广告过滤。
          files: release/cnmwx-native-chat.apk
